# GitHub Actions workflow for deploying retail store microservices
# This workflow implements a GitOps deployment pattern:
# 1. Detects which services have changed
# 2. Builds Docker images and pushes to AWS ECR
# 3. Updates Helm chart values with new image tags
# 4. Commits changes back to the gitops branch
# 5. ArgoCD automatically syncs the changes to Kubernetes

name: Deploy

# Workflow triggers:
# - Push to gitops branch when files in src/ directory change
# - Manual trigger via workflow_dispatch (builds all services)
on:
  push:
    branches: [gitops]
    paths: ['src/**']  # Only trigger on changes to source code
  workflow_dispatch:  # Allow manual triggering from GitHub UI

# Environment variables available to all jobs
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}  # AWS region for ECR and other AWS resources

jobs:
  # Job 1: Detect which microservices have changed
  # This job analyzes git diffs to determine which services need to be rebuilt
  # Outputs a matrix that will be used by the deploy job to run in parallel
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    # Outputs passed to other jobs:
    # - changed-services: space-separated list of service names
    # - matrix: JSON matrix for GitHub Actions matrix strategy
    # - has-changes: boolean flag indicating if any services changed
    outputs:
      changed-services: ${{ steps.changes.outputs.changed-services }}
      matrix: ${{ steps.changes.outputs.matrix }}
      has-changes: ${{ steps.changes.outputs.has-changes }}
    steps:
      # Checkout repository with 2 commits of history (needed for git diff)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need previous commit to compare changes

      # Analyze git history to detect which services changed
      - name: Detect changed services
        id: changes
        run: |
          # List of all microservices in the retail store application
          SERVICES=("ui" "catalog" "cart" "checkout" "orders")
          CHANGED_SERVICES=()
          
          echo "🔍 Checking for changes in services..."
          
          # Iterate through each service and check if files in its directory changed
          # Compares current commit (HEAD) with previous commit (HEAD~1)
          for service in "${SERVICES[@]}"; do
            # Check if any files in src/$service/ changed, OR if this is a manual trigger
            if git diff --name-only HEAD~1 HEAD | grep -q "^src/$service/" || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              CHANGED_SERVICES+=("$service")
              echo "✅ Changes detected in: $service"
            else
              echo "⏭️ No changes in: $service"
            fi
          done
          
          # Manual trigger (workflow_dispatch) builds all services regardless of changes
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "🔄 Manual trigger - building all services"
            CHANGED_SERVICES=("ui" "catalog" "cart" "checkout" "orders")
          fi
          
          # Early exit if no services changed (saves CI/CD resources)
          if [ ${#CHANGED_SERVICES[@]} -eq 0 ]; then
            echo "❌ No services changed"
            echo "has-changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Build JSON matrix for GitHub Actions matrix strategy
          # Matrix format: {"service": ["ui", "catalog", ...]}
          # This allows the deploy job to run in parallel for each changed service
          MATRIX_JSON="["
          for i in "${!CHANGED_SERVICES[@]}"; do
            if [ $i -gt 0 ]; then
              MATRIX_JSON+=","
            fi
            MATRIX_JSON+="\"${CHANGED_SERVICES[$i]}\""
          done
          MATRIX_JSON+="]"
          
          # Set outputs for downstream jobs
          echo "changed-services=${CHANGED_SERVICES[*]}" >> $GITHUB_OUTPUT
          echo "matrix={\"service\":$MATRIX_JSON}" >> $GITHUB_OUTPUT
          echo "has-changes=true" >> $GITHUB_OUTPUT
          
          echo "📊 Services to build: ${CHANGED_SERVICES[*]}"
          echo "📊 Generated matrix: {\"service\":$MATRIX_JSON}"

  # Job 2: Build and deploy changed services
  # Runs in parallel for each service that changed (using matrix strategy)
  # Each matrix instance: builds Docker image, pushes to ECR, updates Helm values, commits changes
  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes  # Wait for change detection to complete
    # Only run if at least one service changed
    if: needs.detect-changes.outputs.has-changes == 'true'
    # Permission to write to repository (needed to commit Helm value updates)
    permissions:
      contents: write
    # Matrix strategy: creates one job instance per changed service
    # fail-fast: false means if one service fails, others continue
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false  # Don't stop other services if one fails
    steps:
      # Checkout repository (needed to update Helm values and commit)
      - uses: actions/checkout@v4

      # Authenticate with AWS using credentials from GitHub Secrets
      # Required for ECR push operations
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login to AWS ECR (Elastic Container Registry)
      # This enables Docker to push images to ECR
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build Docker image and push to AWS ECR
      # Image is tagged with both short commit SHA and 'latest'
      - name: Build and push ${{ matrix.service }}
        run: |
          SERVICE="${{ matrix.service }}"  # Service name from matrix (ui, catalog, cart, etc.)
          TAG="$(echo ${{ github.sha }} | cut -c1-7)"  # First 7 chars of commit SHA (e.g., abc1234)
          AWS_ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID }}"
          # Construct ECR repository URL: <account>.dkr.ecr.<region>.amazonaws.com/<repo-name>
          ECR_REPO="${AWS_ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/retail-store-${SERVICE}"
          
          echo "🔨 Building ${SERVICE}:${TAG}"
          
          # Ensure ECR repository exists (idempotent operation)
          # If repo doesn't exist, create it with security best practices:
          # - Image scanning on push (vulnerability detection)
          # - AES256 encryption (encryption at rest)
          aws ecr describe-repositories --repository-names "retail-store-${SERVICE}" 2>/dev/null || \
          aws ecr create-repository --repository-name "retail-store-${SERVICE}" \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256
          
          # Build Docker image with two tags:
          # - Commit SHA tag: for specific version tracking
          # - Latest tag: for convenience (points to most recent build)
          docker build -t "${ECR_REPO}:${TAG}" -t "${ECR_REPO}:latest" "src/${SERVICE}/"
          
          # Push both tags to ECR
          docker push "${ECR_REPO}:${TAG}"
          docker push "${ECR_REPO}:latest"
          
          echo "✅ Pushed ${ECR_REPO}:${TAG}"
          # Store ECR repo URL in environment for next step
          echo "ECR_REPO=${ECR_REPO}" >> $GITHUB_ENV

      # Update Helm chart values.yaml with new Docker image reference
      # This is a GitOps pattern: update the desired state, ArgoCD will sync it to Kubernetes
      - name: Update Helm values for ${{ matrix.service }}
        run: |
          SERVICE="${{ matrix.service }}"
          TAG="$(echo ${{ github.sha }} | cut -c1-7)"  # Short commit SHA for image tag
          ECR_REPO="${{ env.ECR_REPO }}"  # ECR repository URL from previous step
          VALUES_FILE="src/${SERVICE}/chart/values.yaml"  # Helm values file path
          
          echo "📝 Updating Helm values for ${SERVICE}"
          echo "   Repository: ${ECR_REPO}"
          echo "   Tag: ${TAG}"
          echo "   File: ${VALUES_FILE}"
          
          # Validate that Helm values file exists before attempting update
          if [[ ! -f "${VALUES_FILE}" ]]; then
            echo "❌ Values file not found: ${VALUES_FILE}"
            exit 1
          fi
          
          # Display current image configuration for debugging
          echo "📋 Before update (main service image):"
          grep -A3 "^image:" "${VALUES_FILE}" | head -4 || echo "No main image section found"
          
          # Create backup before modifying (safety measure)
          cp "${VALUES_FILE}" "${VALUES_FILE}.backup"
          
          # Use awk to intelligently update only the main service image
          # This script:
          # 1. Finds the first 'image:' section (main service)
          # 2. Updates repository and tag within that section
          # 3. Preserves all other image references (infrastructure components like MySQL, Redis, etc.)
          # 4. Stops updating when it encounters a new top-level key
          awk -v repo="${ECR_REPO}" -v tag="${TAG}" '
          BEGIN { in_main_image = 0; updated_repo = 0; updated_tag = 0 }
          /^image:/ { in_main_image = 1; print; next }
          in_main_image && /^[[:space:]]*repository:/ && !updated_repo { 
            print "  repository: " repo; updated_repo = 1; next 
          }
          in_main_image && /^[[:space:]]*tag:/ && !updated_tag { 
            print "  tag: \"" tag "\""; updated_tag = 1; next 
          }
          /^[a-zA-Z]/ && !/^image:/ { in_main_image = 0 }  # Reset when new top-level key found
          { print }
          ' "${VALUES_FILE}.backup" > "${VALUES_FILE}"
          
          # Verify the update was successful
          # Check that both repository and tag were updated correctly
          if grep -q "${ECR_REPO}" "${VALUES_FILE}" && grep -q "\"${TAG}\"" "${VALUES_FILE}"; then
            echo "✅ Successfully updated ${VALUES_FILE}"
            echo "📋 After update (main service image):"
            grep -A3 "^image:" "${VALUES_FILE}" | head -4
            
            # Verify infrastructure images (MySQL, Redis, etc.) were not modified
            echo "🔒 Infrastructure images preserved:"
            grep -A1 "repository:" "${VALUES_FILE}" | grep -E "(mysql|redis|postgres|rabbitmq|dynamodb-local)" || echo "No infrastructure images found"
          else
            # Rollback on failure: restore backup and exit with error
            echo "❌ Update failed - restoring backup"
            mv "${VALUES_FILE}.backup" "${VALUES_FILE}"
            exit 1
          fi
          
          # Clean up backup file after successful update
          rm "${VALUES_FILE}.backup"

      # Commit updated Helm values back to gitops branch
      # This completes the GitOps cycle: code change -> image build -> config update -> git commit
      # ArgoCD watches this branch and will automatically deploy the new image to Kubernetes
      - name: Commit Helm changes for ${{ matrix.service }}
        run: |
          SERVICE="${{ matrix.service }}"
          TAG="$(echo ${{ github.sha }} | cut -c1-7)"
          
          # Configure git identity for automated commits
          git config --local user.email "gitops@github.com"
          git config --local user.name "GitOps Bot"
          
          # Only commit if values.yaml actually changed
          # This prevents empty commits when no changes were made
          if ! git diff --quiet "src/${SERVICE}/chart/values.yaml"; then
            # Stage the updated Helm values file
            git add "src/${SERVICE}/chart/values.yaml"
            
            # Create commit with descriptive message including:
            # - Service name
            # - Image tag (commit SHA)
            # - ECR repository name
            # - Full commit SHA for traceability
            git commit -m "🚀 Update ${SERVICE} Helm chart to ${TAG} - ECR: retail-store-${SERVICE} - Commit: ${{ github.sha }}"
            
            # Push with retry logic to handle race conditions
            # Multiple services may try to push simultaneously, causing conflicts
            for i in {1..3}; do
              if git push origin gitops; then
                echo "✅ Successfully pushed Helm update for ${SERVICE}"
                break
              else
                # If push fails, likely due to concurrent updates from other services
                # Pull latest changes and rebase, then retry
                echo "⚠️ Push failed for ${SERVICE}, attempt $i/3. Retrying..."
                git pull --rebase origin gitops  # Rebase local changes on top of remote
                sleep 2  # Brief delay before retry
              fi
              
              # Fail after 3 attempts
              if [ $i -eq 3 ]; then
                echo "❌ Failed to push ${SERVICE} after 3 attempts"
                exit 1
              fi
            done
          else
            echo "📝 No Helm changes to commit for ${SERVICE}"
          fi

  # Job 3: Generate deployment summary
  # Creates a markdown summary visible in GitHub Actions UI
  # Runs regardless of success/failure (if: always()) to provide visibility
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy]  # Wait for both previous jobs
    if: always()  # Run even if previous jobs failed (for visibility)
    steps:
      # Generate markdown summary displayed in GitHub Actions UI
      # This provides a quick overview of what was deployed
      - name: Create deployment summary
        run: |
          # Write markdown header
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Display deployment metadata
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** gitops" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check if any services changed
          if [ "${{ needs.detect-changes.outputs.has-changes }}" == "true" ]; then
            # List which services were changed/deployed
            echo "**Changed Services:** ${{ needs.detect-changes.outputs.changed-services }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Check deployment job result (success/failure)
            if [ "${{ needs.deploy.result }}" == "success" ]; then
              echo "✅ **Status:** Deployment successful" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Actions completed:**" >> $GITHUB_STEP_SUMMARY
              echo "- 🔨 Built and pushed Docker images to ECR" >> $GITHUB_STEP_SUMMARY
              echo "- 📝 Updated Helm chart values" >> $GITHUB_STEP_SUMMARY
              echo "- 💾 Committed changes to repository" >> $GITHUB_STEP_SUMMARY
              echo "- 🔄 ArgoCD will sync automatically" >> $GITHUB_STEP_SUMMARY
            else
              # Deployment failed - provide error guidance
              echo "❌ **Status:** Deployment failed" >> $GITHUB_STEP_SUMMARY
              echo "Check the workflow logs for details" >> $GITHUB_STEP_SUMMARY
            fi
          else
            # No changes detected - workflow skipped deployment
            echo "ℹ️ **Status:** No services changed - no deployment needed" >> $GITHUB_STEP_SUMMARY
          fi